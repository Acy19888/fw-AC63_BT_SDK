name: Build Zuupah Pen Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/zuupah_pen/**'
      - 'apps/spp_and_le/**'
      - 'cpu/br23/**'
      - 'include_lib/**'
      - '.github/workflows/build-zuupah.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manuell auslösen über GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ── 1. Repository laden ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JieLi Toolchain cachen (spart Zeit bei wiederholten Builds) ───────
      - name: Cache JieLi Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/jieli
          key: jieli-linux-toolchain-v1

      # ── 3. JieLi Linux Toolchain herunterladen + installieren ────────────────
      - name: Download & Install JieLi Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Lade JieLi Linux Toolchain herunter..."
          mkdir -p /opt/jieli
          curl -L "https://pkgman.jieliapp.com/s/linux-toolchain" \
            -o /tmp/jieli-toolchain.tar.gz \
            --retry 3 \
            --retry-delay 5 \
            -#
          echo "Entpacke Toolchain..."
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/ --strip-components=1 || \
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/
          echo "Toolchain installiert!"
          ls /opt/jieli/

      # ── 4. Toolchain prüfen ───────────────────────────────────────────────────
      - name: Verify Toolchain
        run: |
          # Clang finden (könnte in verschiedenen Unterordnern sein)
          CLANG=$(find /opt/jieli -name "clang" -type f 2>/dev/null | head -1)
          if [ -z "$CLANG" ]; then
            echo "FEHLER: clang nicht gefunden!"
            find /opt/jieli -type f | head -30
            exit 1
          fi
          echo "Clang gefunden: $CLANG"
          $CLANG --version
          echo "TOOL_DIR=$(dirname $CLANG)" >> $GITHUB_ENV

      # ── 5. Build-Abhängigkeiten ───────────────────────────────────────────────
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y make libssl-dev llvm-14

      # ── 5.5. Patch power_hw.c.o — fix delay_nus section attribute ────────────
      # LTO promotes static delay_nus (pmu_analog.c) to delay_nus.636 with no
      # section attribute → lands in .text (Flash). ldo13_on in .volatile_ram_code
      # (RAM) tries to call it via 23-bit PI32V2 jump → truncated relocation.
      # Fix: add section ".volatile_ram_code" to delay_nus in the LLVM IR bitcode
      # before linking, so delay_nus.636 ends up in RAM alongside ldo13_on.
      - name: Patch cpu.a - fix delay_nus section attribute
        run: |
          set -e
          TOOLDIR=$(find /opt/jieli -name "clang" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
          echo "JieLi tool dir: $TOOLDIR"
          ls "$TOOLDIR/" 2>/dev/null | grep -i "llvm\|dis\|as$" | head -20 || true

          CPU_A="cpu/br23/liba/cpu.a"
          WORK="/tmp/bitcode_patch"
          mkdir -p "$WORK"
          cp "$CPU_A" "$WORK/cpu.a"
          cd "$WORK"
          ar x cpu.a power_hw.c.o
          echo "Extracted power_hw.c.o: $(wc -c < power_hw.c.o) bytes"
          file power_hw.c.o

          # Find llvm-dis: prefer JieLi's, fall back to Ubuntu's llvm-14
          LLVMDIS=""
          LLVMAS=""
          for dis in "$TOOLDIR/llvm-dis" llvm-dis-14 llvm-dis; do
            if command -v "$dis" >/dev/null 2>&1 || [ -f "$dis" ]; then
              LLVMDIS="$dis"
              LLVMAS="${dis/dis/as}"
              echo "Using: $LLVMDIS"
              break
            fi
          done

          if [ -z "$LLVMDIS" ]; then
            echo "No llvm-dis found — cannot patch (build will attempt unpatched)"
            exit 0
          fi

          # Decompile bitcode to LLVM IR text
          "$LLVMDIS" power_hw.c.o -o power_hw.ll 2>&1 || {
            echo "llvm-dis failed (version incompatibility?) — trying with --disable-output check"
            exit 0
          }
          echo "Decompiled OK, $(wc -l < power_hw.ll) lines"
          grep -n "delay_nus" power_hw.ll | head -10

          # Patch: add section ".volatile_ram_code" to delay_nus definition
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_bitcode.py" power_hw.ll

          # Reassemble patched IR back to bitcode
          "$LLVMAS" power_hw.ll -o power_hw_patched.c.o 2>&1 || {
            echo "llvm-as failed — skipping patch"
            exit 0
          }
          echo "Reassembled patched bitcode: $(wc -c < power_hw_patched.c.o) bytes"

          # Replace in archive
          cp cpu.a "$GITHUB_WORKSPACE/$CPU_A"
          ar r "$GITHUB_WORKSPACE/$CPU_A" power_hw_patched.c.o
          echo "✓ Updated $CPU_A with patched power_hw.c.o (delay_nus now in .volatile_ram_code)"

      # ── 6. Firmware kompilieren + sdk.elf sofort sichern ────────────────────
      - name: Build Zuupah Firmware
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware_output

          cd apps/zuupah_pen/board/br23
          ulimit -n 8096
          echo "Starte Build..."
          make VERBOSE=1 2>&1 | tee /tmp/build.log
          echo "Build exit code: $?"

          # sdk.elf SOFORT sichern bevor host-client es löscht
          # (OUT_ELF = ../../../../cpu/br23/tools/sdk.elf relativ zu board/br23)
          ELF="../../../../cpu/br23/tools/sdk.elf"
          if [ -f "$ELF" ]; then
            cp "$ELF" $GITHUB_WORKSPACE/firmware_output/sdk.elf
            echo "✓ sdk.elf gesichert: $(wc -c < $GITHUB_WORKSPACE/firmware_output/sdk.elf) bytes"
          else
            echo "✗ sdk.elf nicht gefunden nach make"
            ls -la ../../../../cpu/br23/tools/*.elf 2>/dev/null || echo "keine .elf Dateien"
          fi

      # ── 7. Firmware-Dateien sammeln ───────────────────────────────────────────
      - name: Collect Firmware Files
        run: |
          mkdir -p firmware_output

          echo "=== ALLE neuen Dateien nach Build ==="
          find cpu/br23/tools -newer cpu/br23/tools/br23loader.bin -type f 2>/dev/null || echo "(keine neuen Dateien)"

          # app.bin holen (Makefile erzeugt es jetzt VOR dem post-script)
          if [ -f "cpu/br23/tools/app.bin" ]; then
            cp cpu/br23/tools/app.bin firmware_output/app.bin
            echo "✓ app.bin: $(wc -c < firmware_output/app.bin) bytes"
          else
            echo "✗ app.bin nicht gefunden in cpu/br23/tools/"
          fi

          # jl_isd.fw suchen (Linux Build Output von host-client)
          FW=$(find cpu/br23/tools -name "jl_isd*.fw" -o -name "jl_isd*.ufw" 2>/dev/null | head -1)
          if [ -n "$FW" ]; then
            cp "$FW" firmware_output/zuupah_pen_firmware.ufw
            echo "✓ firmware: $FW ($(wc -c < firmware_output/zuupah_pen_firmware.ufw) bytes)"
          else
            # Fallback: .ufw NUR aus cpu/br23/tools/ suchen (NICHT cpu/bd29!)
            UFW=$(find cpu/br23/tools -name "*.ufw" 2>/dev/null | head -1)
            if [ -n "$UFW" ]; then
              cp "$UFW" firmware_output/zuupah_pen_firmware.ufw
              echo "✓ ufw: $UFW ($(wc -c < firmware_output/zuupah_pen_firmware.ufw) bytes)"
            else
              echo "✗ Kein firmware file in cpu/br23/tools/ gefunden"
            fi
          fi

          echo "=== firmware_output ==="
          ls -lh firmware_output/

      # ── 8. Build Log als Artifact hochladen ───────────────────────────────────
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      # ── 9. Firmware als Artifact hochladen ────────────────────────────────────
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: zuupah-pen-firmware
          path: firmware_output/
          retention-days: 30

      # ── 10. Zusammenfassung ───────────────────────────────────────────────────
      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Zuupah Firmware Build erfolgreich!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Firmware-Dateien:**" >> $GITHUB_STEP_SUMMARY
          ls -lh firmware_output/ >> $GITHUB_STEP_SUMMARY || echo "Keine Dateien" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Gehe zu Actions → Diesen Run → Artifacts → zuupah-pen-firmware" >> $GITHUB_STEP_SUMMARY

