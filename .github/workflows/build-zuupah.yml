name: Build Zuupah Pen Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/zuupah_pen/**'
      - '.github/workflows/build-zuupah.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manuell auslösen über GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ── 1. Repository laden ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JieLi Toolchain cachen (spart Zeit bei wiederholten Builds) ───────
      - name: Cache JieLi Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/jieli
          key: jieli-linux-toolchain-v1

      # ── 3. JieLi Linux Toolchain herunterladen + installieren ────────────────
      - name: Download & Install JieLi Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Lade JieLi Linux Toolchain herunter..."
          mkdir -p /opt/jieli
          curl -L "https://pkgman.jieliapp.com/s/linux-toolchain" \
            -o /tmp/jieli-toolchain.tar.gz \
            --retry 3 \
            --retry-delay 5 \
            -#
          echo "Entpacke Toolchain..."
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/ --strip-components=1 || \
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/
          echo "Toolchain installiert!"
          ls /opt/jieli/

      # ── 4. Toolchain prüfen ───────────────────────────────────────────────────
      - name: Verify Toolchain
        run: |
          # Clang finden (könnte in verschiedenen Unterordnern sein)
          CLANG=$(find /opt/jieli -name "clang" -type f 2>/dev/null | head -1)
          if [ -z "$CLANG" ]; then
            echo "FEHLER: clang nicht gefunden!"
            find /opt/jieli -type f | head -30
            exit 1
          fi
          echo "Clang gefunden: $CLANG"
          $CLANG --version
          echo "TOOL_DIR=$(dirname $CLANG)" >> $GITHUB_ENV

      # ── 5. Build-Abhängigkeiten ───────────────────────────────────────────────
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y make libssl-dev

      # ── 6. Firmware kompilieren + sdk.elf sofort sichern ────────────────────
      - name: Build Zuupah Firmware
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware_output

          cd apps/zuupah_pen/board/br23
          ulimit -n 8096
          echo "Starte Build..."
          make VERBOSE=1 2>&1 | tee /tmp/build.log
          echo "Build exit code: $?"

          # sdk.elf SOFORT sichern bevor host-client es löscht
          # (OUT_ELF = ../../../../cpu/br23/tools/sdk.elf relativ zu board/br23)
          ELF="../../../../cpu/br23/tools/sdk.elf"
          if [ -f "$ELF" ]; then
            cp "$ELF" $GITHUB_WORKSPACE/firmware_output/sdk.elf
            echo "✓ sdk.elf gesichert: $(wc -c < $GITHUB_WORKSPACE/firmware_output/sdk.elf) bytes"
          else
            echo "✗ sdk.elf nicht gefunden nach make"
            ls -la ../../../../cpu/br23/tools/*.elf 2>/dev/null || echo "keine .elf Dateien"
          fi

      # ── 7. app.bin manuell aus sdk.elf erzeugen ───────────────────────────────
      - name: Generate app.bin from sdk.elf
        run: |
          mkdir -p firmware_output

          # sdk.elf liegt in cpu/br23/tools/ (OUT_ELF im Makefile)
          ELF="cpu/br23/tools/sdk.elf"

          echo "=== cpu/br23/tools/ Inhalt ==="
          ls -lh cpu/br23/tools/ 2>/dev/null | grep -E "\.(bin|elf|ufw|ini)" || echo "(nichts gefunden)"

          # objcopy aus JieLi Toolchain (Makefile nutzt /opt/jieli/pi32v2/bin/objcopy)
          OBJCOPY="/opt/jieli/pi32v2/bin/objcopy"
          if [ ! -f "$OBJCOPY" ]; then
            OBJCOPY=$(find /opt/jieli -name "objcopy" -type f 2>/dev/null | head -1)
          fi
          if [ ! -f "$OBJCOPY" ]; then
            OBJCOPY=$(find /opt/jieli -name "llvm-objcopy" -type f 2>/dev/null | head -1)
          fi
          echo "objcopy: $OBJCOPY (vorhanden: $(test -f "$OBJCOPY" && echo JA || echo NEIN))"
          echo "sdk.elf vorhanden: $(test -f $ELF && echo JA || echo NEIN)"
          echo "=== /opt/jieli/pi32v2/bin/ ==="
          ls /opt/jieli/pi32v2/bin/ 2>/dev/null | head -20 || echo "Ordner nicht gefunden"

          # Wenn sdk.elf noch in cpu/br23/tools/ vorhanden, sonst aus firmware_output
          if [ ! -f "$ELF" ] && [ -f "$GITHUB_WORKSPACE/firmware_output/sdk.elf" ]; then
            ELF="$GITHUB_WORKSPACE/firmware_output/sdk.elf"
            echo "Nutze gesichertes sdk.elf: $ELF"
          fi

          if [ -f "$ELF" ] && [ -n "$OBJCOPY" ]; then
            cd $(dirname $ELF)

            # Alle Sektionen extrahieren (gleich wie Windows download.bat)
            ELF_FILE=$(basename $ELF)
            $OBJCOPY -O binary -j .text        $ELF_FILE text.bin      2>/dev/null; [ -f text.bin ]      || touch text.bin
            $OBJCOPY -O binary -j .data        $ELF_FILE data.bin      2>/dev/null; [ -f data.bin ]      || touch data.bin
            $OBJCOPY -O binary -j .data_code   $ELF_FILE data_code.bin 2>/dev/null; [ -f data_code.bin ] || touch data_code.bin
            $OBJCOPY -O binary -j .overlay_aec $ELF_FILE aec.bin       2>/dev/null; [ -f aec.bin ]       || touch aec.bin
            $OBJCOPY -O binary -j .overlay_wav $ELF_FILE wav.bin       2>/dev/null; [ -f wav.bin ]       || touch wav.bin
            $OBJCOPY -O binary -j .overlay_mp3 $ELF_FILE mp3.bin       2>/dev/null; [ -f mp3.bin ]       || touch mp3.bin
            $OBJCOPY -O binary -j .overlay_wma $ELF_FILE wma.bin       2>/dev/null; [ -f wma.bin ]       || touch wma.bin

            cat text.bin data.bin data_code.bin aec.bin wav.bin mp3.bin wma.bin > app.bin
            echo "✓ app.bin: $(wc -c < app.bin) bytes"

            cp app.bin $GITHUB_WORKSPACE/firmware_output/app.bin
            cd $GITHUB_WORKSPACE
          else
            echo "✗ sdk.elf oder objcopy nicht gefunden!"
            echo "Toolchain-Inhalt:"
            find /opt/jieli -name "*objcopy*" 2>/dev/null | head -5
          fi

          # ufw kopieren
          UFW=$(find cpu/br23/tools . -name "*.ufw" 2>/dev/null | head -1)
          if [ -n "$UFW" ]; then
            cp "$UFW" firmware_output/zuupah_pen_firmware.ufw
            echo "✓ ufw: $(wc -c < firmware_output/zuupah_pen_firmware.ufw) bytes"
          fi

          echo "=== firmware_output ==="
          ls -lh firmware_output/

      # ── 8. Build Log als Artifact hochladen ───────────────────────────────────
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      # ── 9. Firmware als Artifact hochladen ────────────────────────────────────
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: zuupah-pen-firmware
          path: firmware_output/
          retention-days: 30

      # ── 10. Zusammenfassung ───────────────────────────────────────────────────
      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Zuupah Firmware Build erfolgreich!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Firmware-Dateien:**" >> $GITHUB_STEP_SUMMARY
          ls -lh firmware_output/ >> $GITHUB_STEP_SUMMARY || echo "Keine Dateien" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Gehe zu Actions → Diesen Run → Artifacts → zuupah-pen-firmware" >> $GITHUB_STEP_SUMMARY
