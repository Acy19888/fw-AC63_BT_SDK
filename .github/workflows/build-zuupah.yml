name: Build Zuupah Pen Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/zuupah_pen/**'
      - 'apps/spp_and_le/**'
      - 'cpu/br23/**'
      - 'include_lib/**'
      - '.github/workflows/build-zuupah.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manuell auslösen über GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ── 1. Repository laden ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JieLi Toolchain cachen (spart Zeit bei wiederholten Builds) ───────
      - name: Cache JieLi Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/jieli
          key: jieli-linux-toolchain-v1

      # ── 3. JieLi Linux Toolchain herunterladen + installieren ────────────────
      - name: Download & Install JieLi Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Lade JieLi Linux Toolchain herunter..."
          mkdir -p /opt/jieli
          curl -L "https://pkgman.jieliapp.com/s/linux-toolchain" \
            -o /tmp/jieli-toolchain.tar.gz \
            --retry 3 \
            --retry-delay 5 \
            -#
          echo "Entpacke Toolchain..."
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/ --strip-components=1 || \
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/
          echo "Toolchain installiert!"
          ls /opt/jieli/

      # ── 4. Toolchain prüfen ───────────────────────────────────────────────────
      - name: Verify Toolchain
        run: |
          # Clang finden (könnte in verschiedenen Unterordnern sein)
          CLANG=$(find /opt/jieli -name "clang" -type f 2>/dev/null | head -1)
          if [ -z "$CLANG" ]; then
            echo "FEHLER: clang nicht gefunden!"
            find /opt/jieli -type f | head -30
            exit 1
          fi
          echo "Clang gefunden: $CLANG"
          $CLANG --version
          TOOLDIR=$(dirname "$CLANG")
          echo "TOOL_DIR=$TOOLDIR" >> $GITHUB_ENV
          # Detect JieLi's LLVM version for matching dis/as tools
          LLVM_VER=$("$CLANG" --version 2>&1 | grep -oP '(?i)clang version \K\d+' | head -1 || echo "")
          echo "JieLi LLVM version: ${LLVM_VER:-unknown}"
          echo "JIELI_LLVM_VER=${LLVM_VER}" >> $GITHUB_ENV
          # List all tools in JieLi bin for diagnostics
          echo "Tools in JieLi bin:"
          ls "$TOOLDIR/" | head -60

      # ── 5. Build-Abhängigkeiten ───────────────────────────────────────────────
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y make libssl-dev llvm-14
          # Also install matching LLVM version if different from 14
          if [ -n "$JIELI_LLVM_VER" ] && [ "$JIELI_LLVM_VER" != "14" ]; then
            sudo apt-get install -y "llvm-${JIELI_LLVM_VER}" 2>&1 | tail -5 || true
            echo "Installed llvm-${JIELI_LLVM_VER}"
          fi

      # ── 6a. cpu.a NICHT mehr patchen ────────────────────────────────────────
      # Die JieLi SDK LFLAGS lösen das delay_nus/ldo13_on Problem korrekt:
      #   --plugin-opt=-inline-normal-into-special-section=true
      #     → LTO inlined delay_nus direkt in ldo13_on (.volatile_ram_code)
      #   --dont-complain-call-overflow → unterdrückt verbleibende Bereichsfehler
      # power_hw.c.o bleibt im Archiv; ldo13_on kommt aus der Library.

      # ── 6b. Firmware kompilieren + sdk.elf sofort sichern ───────────────────
      - name: Build Zuupah Firmware
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware_output

          cd apps/zuupah_pen/board/br23
          ulimit -n 8096
          echo "Starte Build..."
          make VERBOSE=1 2>&1 | tee /tmp/build.log
          echo "Build exit code: $?"

          # sdk.elf SOFORT sichern bevor host-client es löscht
          # (OUT_ELF = ../../../../cpu/br23/tools/sdk.elf relativ zu board/br23)
          ELF="../../../../cpu/br23/tools/sdk.elf"
          if [ -f "$ELF" ]; then
            cp "$ELF" $GITHUB_WORKSPACE/firmware_output/sdk.elf
            echo "✓ sdk.elf gesichert: $(wc -c < $GITHUB_WORKSPACE/firmware_output/sdk.elf) bytes"
          else
            echo "✗ sdk.elf nicht gefunden nach make"
            ls -la ../../../../cpu/br23/tools/*.elf 2>/dev/null || echo "keine .elf Dateien"
          fi

      # ── 7. Firmware-Dateien sammeln ───────────────────────────────────────────
      - name: Collect Firmware Files
        run: |
          mkdir -p firmware_output

          echo "=== ALLE neuen Dateien nach Build ==="
          find cpu/br23/tools -newer cpu/br23/tools/br23loader.bin -type f 2>/dev/null || echo "(keine neuen Dateien)"

          # app.bin holen (Makefile erzeugt es jetzt VOR dem post-script)
          if [ -f "cpu/br23/tools/app.bin" ]; then
            cp cpu/br23/tools/app.bin firmware_output/app.bin
            echo "✓ app.bin: $(wc -c < firmware_output/app.bin) bytes"
          else
            echo "✗ app.bin nicht gefunden in cpu/br23/tools/"
          fi

          # jl_isd.fw suchen (Linux Build Output von host-client)
          FW=$(find cpu/br23/tools -name "jl_isd*.fw" -o -name "jl_isd*.ufw" 2>/dev/null | head -1)
          if [ -n "$FW" ]; then
            cp "$FW" firmware_output/zuupah_pen_firmware.ufw
            echo "✓ firmware: $FW ($(wc -c < firmware_output/zuupah_pen_firmware.ufw) bytes)"
          else
            # Fallback: .ufw NUR aus cpu/br23/tools/ suchen (NICHT cpu/bd29!)
            UFW=$(find cpu/br23/tools -name "*.ufw" 2>/dev/null | head -1)
            if [ -n "$UFW" ]; then
              cp "$UFW" firmware_output/zuupah_pen_firmware.ufw
              echo "✓ ufw: $UFW ($(wc -c < firmware_output/zuupah_pen_firmware.ufw) bytes)"
            else
              echo "✗ Kein firmware file in cpu/br23/tools/ gefunden"
            fi
          fi

          echo "=== firmware_output ==="
          ls -lh firmware_output/

      # ── 8. Build Log als Artifact hochladen ───────────────────────────────────
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      # ── 9. Firmware als Artifact hochladen ────────────────────────────────────
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: zuupah-pen-firmware
          path: firmware_output/
          retention-days: 30

      # ── 10. Zusammenfassung ───────────────────────────────────────────────────
      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Zuupah Firmware Build erfolgreich!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Firmware-Dateien:**" >> $GITHUB_STEP_SUMMARY
          ls -lh firmware_output/ >> $GITHUB_STEP_SUMMARY || echo "Keine Dateien" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Gehe zu Actions → Diesen Run → Artifacts → zuupah-pen-firmware" >> $GITHUB_STEP_SUMMARY

