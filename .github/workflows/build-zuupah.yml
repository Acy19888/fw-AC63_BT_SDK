name: Build Zuupah Pen Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/zuupah_pen/**'
      - 'apps/spp_and_le/**'
      - 'cpu/br23/**'
      - 'include_lib/**'
      - '.github/workflows/build-zuupah.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ── 1. Repository laden ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JieLi Toolchain cachen ────────────────────────────────────────────
      - name: Cache JieLi Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/jieli
          key: jieli-linux-toolchain-v1

      # ── 3. JieLi Linux Toolchain herunterladen ────────────────────────────────
      - name: Download & Install JieLi Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/jieli
          curl -L "https://pkgman.jieliapp.com/s/linux-toolchain" \
            -o /tmp/jieli-toolchain.tar.gz --retry 3 --retry-delay 5 -#
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/ --strip-components=1 || \
          tar -xf /tmp/jieli-toolchain.tar.gz -C /opt/jieli/
          ls /opt/jieli/

      # ── 4. Toolchain prüfen ───────────────────────────────────────────────────
      - name: Verify Toolchain
        run: |
          echo "=== Toolchain-Struktur ==="
          find /opt/jieli -type f -executable 2>/dev/null | sort

          # Clang finden — unterstütze beide Toolchain-Layouts:
          # Alt: /opt/jieli/pi32v2/bin/clang  (v1-Cache)
          # Neu: /opt/jieli/common/bin/clang   (aktueller Download)
          CLANG=$(find /opt/jieli -name "clang" -type f 2>/dev/null | head -1)
          if [ -z "$CLANG" ]; then
            echo "FEHLER: clang nicht gefunden!"
            exit 1
          fi
          echo "clang: $CLANG"
          "$CLANG" --version

          # TOOL_DIR = Verzeichnis mit clang
          TOOLDIR=$(dirname "$CLANG")
          echo "TOOL_DIR=$TOOLDIR" >> $GITHUB_ENV
          echo "Tools in $TOOLDIR:"
          ls "$TOOLDIR/"

          # LLVM-Version für apt-Paket
          LLVM_VER=$("$CLANG" --version 2>&1 | grep -oP '(?i)clang version \K\d+' | head -1 || echo "")
          echo "JIELI_LLVM_VER=${LLVM_VER}" >> $GITHUB_ENV
          echo "JieLi LLVM version: ${LLVM_VER:-unbekannt}"

      # ── 5. Build-Abhängigkeiten ───────────────────────────────────────────────
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y make
          # llvm-size als Fallback für objsizedump (falls nicht in JieLi-Toolchain)
          sudo apt-get install -y llvm-14 2>/dev/null || true

      # ── 6. Firmware kompilieren ───────────────────────────────────────────────
      - name: Build Zuupah Firmware
        env:
          CPU: br23
          APP_CASE: spp_and_le
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware_output

          cd apps/zuupah_pen/board/br23
          ulimit -n 8096

          # stub-Skripte für post-script-Tools die nicht in der Toolchain sind
          # (download.sh-Fehler ignoriert make durch '-' Präfix, aber Stubs
          #  sorgen für saubere Log-Ausgabe)
          sudo mkdir -p /opt/utils
          for stub in /usr/local/bin/host-client /opt/utils/strip-ini /usr/local/bin/lz4_packet; do
            if ! command -v "$(basename $stub)" >/dev/null 2>&1 && [ ! -f "$stub" ]; then
              printf '#!/bin/sh\necho "[stub] %s $@"\n' "$(basename $stub)" | sudo tee "$stub" > /dev/null
              sudo chmod +x "$stub"
            fi
          done

          echo "=== Build starten ==="
          make VERBOSE=1 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"

          # sdk.elf sichern (Makefile legt es in cpu/br23/tools/)
          ELF="../../../../cpu/br23/tools/sdk.elf"
          if [ -f "$ELF" ]; then
            cp "$ELF" $GITHUB_WORKSPACE/firmware_output/sdk.elf
            echo "✓ sdk.elf: $(wc -c < $GITHUB_WORKSPACE/firmware_output/sdk.elf) bytes"
          else
            echo "✗ sdk.elf nicht gefunden"
          fi

          # app.bin: Makefile erstellt es inline (vor dem post-script)
          if [ -f "../../../../cpu/br23/tools/app.bin" ]; then
            echo "✓ app.bin: $(wc -c < ../../../../cpu/br23/tools/app.bin) bytes"
          else
            echo "✗ app.bin fehlt — echter Compile-Fehler!"
            echo "--- Build-Log (letzte 50 Zeilen) ---"
            tail -50 /tmp/build.log
            exit 1
          fi

          echo "✓ Build erfolgreich"

      # ── 7. Firmware-Dateien sammeln ───────────────────────────────────────────
      - name: Collect Firmware Files
        run: |
          mkdir -p firmware_output

          # app.bin (Firmware, fertig zum Flashen)
          cp cpu/br23/tools/app.bin firmware_output/app.bin
          echo "✓ app.bin: $(wc -c < firmware_output/app.bin) bytes"

          # Flash-Paket für isd_download.exe (Windows)
          for f in isd_config.ini br23loader.bin uboot.boot flash_params.bin cfg_tool.bin; do
            SRC="cpu/br23/tools/$f"
            if [ -f "$SRC" ]; then
              cp "$SRC" "firmware_output/$f"
              echo "✓ $f"
            fi
          done

          echo "=== firmware_output ==="
          ls -lh firmware_output/

      # ── 8. Build-Log hochladen ────────────────────────────────────────────────
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      # ── 9. Firmware als Artifact hochladen ────────────────────────────────────
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: zuupah-pen-firmware
          path: firmware_output/
          retention-days: 30

      # ── 10. Zusammenfassung ───────────────────────────────────────────────────
      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Zuupah Firmware Build erfolgreich!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Firmware-Dateien:**" >> $GITHUB_STEP_SUMMARY
          ls -lh firmware_output/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Actions → Diesen Run → Artifacts → zuupah-pen-firmware" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Flash-Anleitung:** Chip hat OTP-Key → USB-Flash benötigt Key-File." >> $GITHUB_STEP_SUMMARY
          echo "Alternative: OTA per Bluetooth (JL OTA App)" >> $GITHUB_STEP_SUMMARY
